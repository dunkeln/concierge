.note{font-size:15px;fill:var(--muted)}.label{font-size:18px}.value{font-size:17px;fill:var(--accent);font-variant-numeric:tabular-nums}
.grid{stroke:var(--grid);stroke-width:1}.range{stroke:var(--accent);stroke-width:2.5}.median{fill:var(--accent)}.tail{fill:none;stroke:var(--accent);stroke-width:2}
@media(prefers-color-scheme:dark){svg{--ink:#eee9f5;--muted:#b7aec4;--accent:#bba7d7;--grid:#393141}}
