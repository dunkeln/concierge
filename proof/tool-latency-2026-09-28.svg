<svg xmlns="http://www.w3.org/2000/svg" width="760" height="546" viewBox="0 0 760 546" role="img" aria-labelledby="title desc">
<title id="title">Reservation checks carry the long waits</title>
<desc id="desc">Median-to-p95 range plot from 283 Sentry tool spans over seven days. Four tools shown: followup, 64 calls, median 0.3 milliseconds and p95 2 milliseconds; place search, 47 calls, 0.73 to 2.16 seconds; reservation checks, 148 calls, 9.98 to 46.86 seconds; checkout preparation, 7 calls, 17.36 to 46.97 seconds. Separate Braintrust selected regression cohort: 47 of 47 checks passed, 33 of 33 browser journeys completed, 20 of 20 chat transports completed. Cohort includes mocked, API, live and setup checks; it is not a production success rate.</desc>
